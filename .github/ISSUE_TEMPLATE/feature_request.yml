name: Feature request
description: Propose a reusable workflow, reference, or compatibility improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: User scenario
      description: What real task should the skill handle better?
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: Current limitation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core workflow
        - Create mode
        - Extend mode
        - Reconstruct mode
        - Improve mode
        - Design foundations
        - Style recipes
        - Implementation patterns
        - Quality assurance
        - Documentation or metadata
    validations:
      required: true
